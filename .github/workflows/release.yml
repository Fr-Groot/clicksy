name: Build et release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace --locked

      - name: Installer tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Construire le MSI (et l'exe)
        working-directory: app
        run: cargo tauri build

      - name: Préparer les fichiers
        shell: pwsh
        run: |
          $version = (Get-Content app/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item target/release/clicksy.exe, README.md, LICENSE dist/portable/
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/Clicksy-$version-portable.zip" -Force
          Copy-Item target/release/bundle/msi/*.msi dist/
          Get-FileHash dist/*.zip, dist/*.msi -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: clicksy-windows
          path: |
            dist/*.zip
            dist/*.msi
            dist/SHA256SUMS.txt

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.msi
            dist/SHA256SUMS.txt
